# Example snippets inside the existing TLS server. Review actual mount and routes before use.
# /srv/mbox-native contains only public manifests and immutable APKs; no credentials.
location = /native-updates/staff/preview.json {
    alias /srv/mbox-native/preview.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /native-updates/staff/stable.json {
    alias /srv/mbox-native/stable.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ~ ^/native-updates/staff/([A-Za-z0-9_-][A-Za-z0-9_.-]*\.apk)$ {
    alias /srv/mbox-native/$1;
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}
