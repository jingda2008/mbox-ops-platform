name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-pre-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Enforce validation or commercial acceptance boundary
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${version}" == *-rc.* ]]; then
            npm run tc:verify
            npm run quality:model:verify
          else
            npm run release:quality-gate
          fi
      - name: Validate tag and release metadata
        run: |
          node scripts/verify-release-metadata.mjs
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}"
      - id: verified-run
        name: Wait for the successful tag CI image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=
          for _ in $(seq 1 90); do
            run_id=$(gh run list \
              --workflow ci.yml \
              --branch "${GITHUB_REF_NAME}" \
              --commit "${GITHUB_SHA}" \
              --event push \
              --json databaseId,status,conclusion,headSha \
              --jq 'map(select(.status == "completed" and .conclusion == "success")) | .[0].databaseId // empty')
            [ -n "${run_id}" ] && break
            sleep 10
          done
          test -n "${run_id}"
          printf 'run_id=%s\n' "${run_id}" >> "${GITHUB_OUTPUT}"
      - name: Download the CI-staged immutable bundle and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-artifact
          gh release download "${GITHUB_REF_NAME}" \
            --dir release-artifact \
            --clobber
      - name: Extract and verify the exact CI evidence bundles
        env:
          VERIFIED_RUN_ID: ${{ steps.verified-run.outputs.run_id }}
        run: |
          quality_archive="quality-evidence-${GITHUB_SHA}.tar.gz"
          runtime_archive="runtime-quality-${GITHUB_SHA}.tar.gz"
          (
            cd release-artifact
            sha256sum --check "${quality_archive}.sha256"
            sha256sum --check "${runtime_archive}.sha256"
          )
          mkdir -p verified-ci-evidence/quality verified-ci-evidence/runtime
          tar -xzf "release-artifact/${quality_archive}" -C verified-ci-evidence/quality
          tar -xzf "release-artifact/${runtime_archive}" -C verified-ci-evidence/runtime
          (
            cd verified-ci-evidence/quality
            sha256sum --check SHA256SUMS
          )
          (
            cd verified-ci-evidence/runtime
            sha256sum --check SHA256SUMS
          )
          node scripts/verify-quality-evidence.mjs \
            --input verified-ci-evidence/quality/ci-quality-evidence.json \
            --policy docs/quality-policy-mbox-v1.json \
            --require-immutable \
            --require-release-pass
          node - <<'NODE'
          const fs = require('node:fs')
          const ledger = JSON.parse(fs.readFileSync('verified-ci-evidence/quality/ci-quality-evidence.json', 'utf8'))
          if (ledger.source?.commitSha !== process.env.GITHUB_SHA) throw new Error('quality ledger commit mismatch')
          if (String(ledger.ci?.runId) !== process.env.VERIFIED_RUN_ID) throw new Error('quality ledger CI run mismatch')
          if ([...(ledger.testRuns ?? []), ...(ledger.performance ?? [])]
            .some((gate) => gate.required && (gate.artifactStatus !== 'available' || gate.validityStatus !== 'valid'))) {
            throw new Error('quality ledger contains unavailable or invalid required evidence')
          }
          NODE
      - name: Verify downloaded immutable bundle
        run: |
          version=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('release-artifact/release-manifest.json', 'utf8'));
            if (manifest.releaseSha !== process.env.GITHUB_SHA) throw new Error('release SHA mismatch');
            if (manifest.releaseVersion !== '${version}') throw new Error('release version mismatch');
            if (!/^sha256:[0-9a-f]{64}$/.test(manifest.imageDigest)) throw new Error('image digest is not immutable');
            for (const item of [manifest.configuration?.store, manifest.configuration?.catalog]) {
              if (!item || !/^[0-9a-f]{64}$/.test(item.sha256)) throw new Error('configuration digest is missing');
              const path = 'release-artifact/' + item.file;
              if (!fs.existsSync(path)) throw new Error('release configuration file is missing');
              const digest = require('node:crypto').createHash('sha256').update(fs.readFileSync(path)).digest('hex');
              if (digest !== item.sha256) throw new Error('release configuration digest mismatch');
            }
          "
          (
            cd release-artifact
            sha256sum --check ./*.tar.gz.sha256
          )
      - name: Build the short-lived OSS transfer bundle
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-metadata
          cp release-artifact/release-manifest.json release-metadata/
          cp release-artifact/migration-manifest.json release-metadata/
          cp release-artifact/mbox-lujiazui.store.json release-metadata/
          cp release-artifact/menu-catalog-2026-07-27.json release-metadata/
          node scripts/build-aliyun-evidence-bundle.mjs \
            --output oss-ready-evidence \
            --channel rc \
            --version "${version}" \
            --sha "${GITHUB_SHA}" \
            --ci-run-id "${{ steps.verified-run.outputs.run_id }}" \
            --input quality=verified-ci-evidence/quality \
            --input runtime=verified-ci-evidence/runtime \
            --input release=release-metadata
          node scripts/verify-sensitive-artifacts.mjs oss-ready-evidence
          (
            cd oss-ready-evidence
            sha256sum --check SHA256SUMS
          )
      - name: Upload short-lived OSS transfer bundle
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: oss-ready-evidence-${{ github.sha }}
          path: oss-ready-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Publish the verified GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release edit "${GITHUB_REF_NAME}" \
            --verify-tag \
            --draft=false \
            --prerelease \
            --title "M-BOX Ops Platform ${version}" \
            --notes-file "docs/release-${version}.md"
