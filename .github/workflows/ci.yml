name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      ui_only: ${{ steps.scope.outputs.ui_only }}
      frontend_only: ${{ steps.scope.outputs.frontend_only }}
      fast: ${{ steps.scope.outputs.fast }}
      full: ${{ steps.scope.outputs.full }}
      migration_changed: ${{ steps.scope.outputs.migration_changed }}
      release_artifact_required: ${{ steps.scope.outputs.release_artifact_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        name: Classify change risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          node scripts/classify-ci-scope.mjs
          --base "${BASE_SHA}"
          --head "${GITHUB_SHA}"
          --event "${GITHUB_EVENT_NAME}"
          --ref "${GITHUB_REF}"
          --github-output "${GITHUB_OUTPUT}"

  docs:
    if: needs.classify.outputs.scope == 'docs'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify documentation diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE_SHA}" ] && ! printf '%s' "${BASE_SHA}" | grep -Eq '^0+$'; then
            git diff --check "${BASE_SHA}" "${GITHUB_SHA}"
          else
            git diff --check "${GITHUB_SHA}^" "${GITHUB_SHA}"
          fi
      - name: Verify release metadata
        run: node scripts/verify-release-metadata.mjs
      - name: Verify CI change classifier
        run: node --test scripts/ci-change-scope.test.mjs

  quality:
    if: needs.classify.outputs.scope == 'full'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: ${{ github.event_name == 'push' && github.ref_type != 'tag' && 'npm' || '' }}
      - run: npm ci
      - name: Install release-smoke browser
        run: npx playwright install --with-deps chromium
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run code, unit, metadata and production-build checks
        run: npm run check && npm run release:system:test
      - name: Verify candidate, upload and release gate semantics
        run: npm run release:miniprogram:test

  fast_quality:
    if: needs.classify.outputs.fast == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: ${{ github.event_name == 'push' && github.ref_type != 'tag' && 'npm' || '' }}
      - run: npm ci
      - name: Install release-smoke browser
        run: npx playwright install --with-deps chromium
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run deterministic frontend checks and production build
        run: npm run check

  normalized_database:
    if: needs.classify.outputs.scope == 'full'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbox
          POSTGRES_PASSWORD: mbox_normalized_test
          POSTGRES_DB: mbox_normalized_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbox -d mbox_normalized_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mbox:mbox_normalized_test@127.0.0.1:5432/mbox_normalized_test
      TEST_NORMALIZED_DATABASE_URL: postgresql://mbox:mbox_normalized_test@127.0.0.1:5432/mbox_normalized_test
      TEST_NORMALIZED_ADMIN_URL: postgresql://mbox:mbox_normalized_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: ${{ github.event_name == 'push' && github.ref_type != 'tag' && 'npm' || '' }}
      - run: npm ci
      - name: Apply normalized-only migrations to a clean database
        run: npm run db:migrate:normalized
      - name: Run every normalized PostgreSQL transaction and RLS test
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run test:normalized:postgres
      - name: Run real normalized HTTP workflows against an isolated database
        env:
          DURATION_SECONDS: 60
          OUTPUT_FILE: artifacts/normalized-http-acceptance/report.json
          APP_COMMIT_SHA: ${{ github.sha }}
        run: npm run acceptance:normalized:http
      - name: Seal normalized HTTP acceptance evidence
        if: always()
        run: |
          if [ -f artifacts/normalized-http-acceptance/report.json ]; then
            cd artifacts/normalized-http-acceptance
            sha256sum report.json > SHA256SUMS
            sha256sum --check SHA256SUMS
          fi
      - name: Upload normalized HTTP acceptance evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: normalized-http-acceptance-${{ github.sha }}
          path: artifacts/normalized-http-acceptance
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
      - name: Enforce normalized code and migration boundaries
        run: |
          npm run architecture:normalized:new
          npm run architecture:normalized:zero

  normalized_browser:
    if: needs.classify.outputs.scope == 'full' || needs.classify.outputs.scope == 'ui' || needs.classify.outputs.scope == 'frontend'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      startup_report_b64: ${{ steps.normalized-browser-evidence.outputs.startup_report_b64 }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbox
          POSTGRES_PASSWORD: mbox_normalized_browser_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbox -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_NORMALIZED_ADMIN_URL: postgresql://mbox:mbox_normalized_browser_test@127.0.0.1:5432/postgres
      APP_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: ${{ github.event_name == 'push' && github.ref_type != 'tag' && 'npm' || '' }}
      - run: npm ci
      - id: normalized-playwright-cache
        if: github.event_name == 'push' && github.ref_type != 'tag'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
      - if: github.ref_type == 'tag' || steps.normalized-playwright-cache.outputs.cache-hit != 'true'
        name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run normalized mobile commercial flows against an isolated database
        run: npm run test:e2e:normalized
      - name: Seal normalized browser startup evidence
        id: normalized-browser-evidence
        run: |
          node -e "const r=JSON.parse(require('fs').readFileSync('artifacts/normalized-browser/startup.json','utf8')); if(r.gate?.passed!==true) process.exit(1)"
          printf 'startup_report_b64=%s\n' "$(base64 -w0 artifacts/normalized-browser/startup.json)" >> "${GITHUB_OUTPUT}"
      - name: Upload normalized browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: normalized-browser-${{ github.sha }}
          path: |
            artifacts/normalized-browser/report
            artifacts/normalized-browser/results
            artifacts/normalized-browser/startup.json
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

  performance:
    if: needs.classify.outputs.scope == 'full'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      load_report_b64: ${{ steps.runtime-evidence.outputs.load_report_b64 }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbox
          POSTGRES_PASSWORD: mbox_normalized_performance_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbox -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_NORMALIZED_ADMIN_URL: postgresql://mbox:mbox_normalized_performance_test@127.0.0.1:5432/postgres
      APP_COMMIT_SHA: ${{ github.sha }}
      MBOX_DATABASE_POOL_MAX: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: ${{ github.event_name == 'push' && github.ref_type != 'tag' && 'npm' || '' }}
      - run: npm ci
      - name: Run normalized core at sustained 5 RPS against a fresh database
        env:
          TARGET_RPS: 5
          DURATION_SECONDS: 60
          OUTPUT_FILE: artifacts/runtime-quality/client-observed-load.json
        run: npm run acceptance:normalized:http
      - name: Seal and verify runtime evidence
        if: always()
        id: runtime-evidence
        run: |
          node -e "JSON.parse(require('fs').readFileSync('artifacts/runtime-quality/client-observed-load.json', 'utf8'))"
          (
            cd artifacts/runtime-quality
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          printf 'load_report_b64=%s\n' "$(base64 -w0 artifacts/runtime-quality/client-observed-load.json)" >> "${GITHUB_OUTPUT}"
      - name: Upload successful runtime evidence
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: runtime-quality-${{ github.sha }}
          path: artifacts/runtime-quality
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
      - name: Upload failed runtime diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics-${{ github.sha }}
          path: artifacts/runtime-quality
          if-no-files-found: warn
          retention-days: 7

  image:
    if: needs.classify.outputs.full == 'true' && needs.classify.outputs.release_artifact_required == 'true'
    needs: [classify, quality, normalized_database, normalized_browser, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject an off-main release tag before image construction
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        name: Resolve immutable image metadata
        run: |
          version=$(node -p "require('./package.json').version")
          short_sha=${GITHUB_SHA:0:7}
          image_tag="mbox-normalized:${version}-${short_sha}"
          printf 'version=%s\nshort_sha=%s\nimage_tag=%s\n' "${version}" "${short_sha}" "${image_tag}" >> "${GITHUB_OUTPUT}"
      - name: Build production image once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.image_tag }}
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
            APP_RELEASE_VERSION=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=mbox-normalized-runtime
          cache-to: ${{ github.event_name == 'push' && github.ref_type != 'tag' && 'type=gha,mode=max,scope=mbox-normalized-runtime' || '' }}
      - name: Package immutable deployment bundle
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
        run: |
          mkdir -p release-artifact
          archive="release-artifact/mbox-normalized-${VERSION}-${SHORT_SHA}.tar.gz"
          docker save "${IMAGE_TAG}" | gzip -1 > "${archive}"
          image_digest=$(tar -xOf "${archive}" index.json \
            | jq -er '.manifests[] | select(.annotations["org.opencontainers.image.ref.name"] != null) | .digest' \
            | head -n 1)
          test "${image_digest}" = "sha256:$(tar -xOf "${archive}" "blobs/sha256/${image_digest#sha256:}" | sha256sum | awk '{print $1}')"
          platform_manifest_digest=$(tar -xOf "${archive}" "blobs/sha256/${image_digest#sha256:}" \
            | jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' \
            | head -n 1)
          platform_image_digest=$(tar -xOf "${archive}" "blobs/sha256/${platform_manifest_digest#sha256:}" \
            | jq -er '.config.digest')
          test "${platform_image_digest}" = "$(docker image inspect "${IMAGE_TAG}" --format '{{.Id}}')"
          node scripts/generate-migration-manifest.mjs \
            --directory database/normalized-migrations \
            --output release-artifact/migration-manifest.json >/dev/null
          cp deploy/normalized-store/mbox-lujiazui.store.json release-artifact/
          cp config/menu-catalog-2026-07-27.json release-artifact/
          cp deploy/aliyun/{deploy-release,activate-release,rollback-activated-release,verify-public-app,stage-release-evidence,upload-oss-verified,send-sls-events,prune-oss-images,release-state,normalize-runtime-env,backup-postgres,restore-postgres}.sh release-artifact/
          MBOX_BUNDLE_ARCHIVE="${archive}" \
          MBOX_BUNDLE_SHA="${GITHUB_SHA}" \
          MBOX_BUNDLE_VERSION="${VERSION}" \
          MBOX_BUNDLE_SOURCE_BRANCH=main \
          MBOX_BUNDLE_FROZEN_AT="$(git show -s --format=%cI "${GITHUB_SHA}")" \
          MBOX_BUNDLE_CONFIG_VERSION=normalized-runtime-config/v1 \
          MBOX_BUNDLE_IMAGE_TAG="${IMAGE_TAG}" \
          MBOX_BUNDLE_IMAGE_DIGEST="${image_digest}" \
          MBOX_BUNDLE_PLATFORM_IMAGE_DIGEST="${platform_image_digest}" \
          MBOX_MIGRATION_MANIFEST=release-artifact/migration-manifest.json \
          MBOX_STORE_CONFIG=release-artifact/mbox-lujiazui.store.json \
          MBOX_CATALOG_CONFIG=release-artifact/menu-catalog-2026-07-27.json \
          MBOX_DEPLOYMENT_SCRIPT_DIR=release-artifact \
          MBOX_BUNDLE_MANIFEST=release-artifact/release-manifest.json \
            node scripts/write-release-bundle-manifest.mjs >/dev/null
          (
            cd release-artifact
            sha256sum "$(basename "${archive}")" > "$(basename "${archive}").sha256"
          )
      - name: Upload the exact image used by validation and deployment
        if: github.ref_type != 'tag'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mbox-normalized-image-${{ github.sha }}
          path: release-artifact
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
      - name: Stage the immutable tag bundle in a draft pre-release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          test "${GITHUB_REF_NAME}" = "v${{ steps.metadata.outputs.version }}"
          assets=(release-artifact/*)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --draft \
              --title "M-BOX Ops Platform ${version}" \
              --notes-file "docs/release-${version}.md"
          fi

  verify:
    if: always()
    needs: [classify, docs, quality, fast_quality, normalized_database, normalized_browser, performance, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Download full-scope runtime evidence
        if: needs.classify.outputs.scope == 'full' && needs.performance.result == 'success' && github.event_name != 'pull_request'
        id: runtime-evidence-download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: runtime-quality-${{ github.sha }}
          path: artifacts/runtime-quality
      - name: Verify downloaded runtime evidence checksums
        if: steps.runtime-evidence-download.outcome == 'success'
        run: |
          cd artifacts/runtime-quality
          sha256sum --check SHA256SUMS
      - name: Write commit-scoped CI quality ledger
        env:
          MBOX_CI_SCOPE: ${{ needs.classify.outputs.scope }}
          MBOX_CI_RELEASE_ARTIFACT_REQUIRED: ${{ needs.classify.outputs.release_artifact_required }}
          MBOX_CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MBOX_CI_LOAD_EVIDENCE_BASE64: ${{ needs.performance.outputs.load_report_b64 }}
          MBOX_CI_BROWSER_STARTUP_EVIDENCE_BASE64: ${{ needs.normalized_browser.outputs.startup_report_b64 }}
          MBOX_CI_RESULTS_JSON: >-
            {"docs":"${{ needs.docs.result }}","quality":"${{ needs.quality.result }}","fast_quality":"${{ needs.fast_quality.result }}","normalized_database":"${{ needs.normalized_database.result }}","normalized_browser":"${{ needs.normalized_browser.result }}","performance":"${{ needs.performance.result }}","image":"${{ needs.image.result }}"}
        run: node scripts/write-ci-quality-evidence.mjs
      - name: Verify immutable CI quality ledger
        run: >-
          node scripts/verify-quality-evidence.mjs
          --input artifacts/quality-evidence/ci-quality-evidence.json
          --policy docs/quality-policy-mbox-v1.json
          --output artifacts/quality-evidence/verification-report.json
          --require-immutable
          --require-release-pass
      - name: Seal CI quality ledger
        if: always()
        run: |
          cd artifacts/quality-evidence
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Materialize tag runtime evidence without Actions artifacts
        if: success() && github.ref_type == 'tag' && needs.classify.outputs.scope == 'full'
        env:
          LOAD_REPORT_B64: ${{ needs.performance.outputs.load_report_b64 }}
          STARTUP_REPORT_B64: ${{ needs.normalized_browser.outputs.startup_report_b64 }}
        run: |
          test -n "${LOAD_REPORT_B64}"
          test -n "${STARTUP_REPORT_B64}"
          mkdir -p artifacts/runtime-quality
          printf '%s' "${LOAD_REPORT_B64}" | base64 --decode > artifacts/runtime-quality/client-observed-load.json
          printf '%s' "${STARTUP_REPORT_B64}" | base64 --decode > artifacts/runtime-quality/normalized-browser-startup.json
          node -e "JSON.parse(require('fs').readFileSync('artifacts/runtime-quality/client-observed-load.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('artifacts/runtime-quality/normalized-browser-startup.json', 'utf8'))"
          (
            cd artifacts/runtime-quality
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Publish pull-request quality evidence summary
        if: always() && github.event_name == 'pull_request'
        run: |
          {
            printf '## Commit-scoped quality evidence\n\n'
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Workflow run: `%s`\n' "${GITHUB_RUN_ID}"
            printf -- '- Evidence checksums:\n\n```text\n'
            cat artifacts/quality-evidence/SHA256SUMS
            printf '```\n\n'
            printf '<details><summary>Quality ledger</summary>\n\n```json\n'
            cat artifacts/quality-evidence/ci-quality-evidence.json
            printf '\n```\n</details>\n'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload successful commit-scoped CI quality ledger
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.sha }}
          path: artifacts/quality-evidence
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
      - name: Upload failed quality diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics-${{ github.sha }}
          path: artifacts/quality-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce the selected release gate
        if: always()
        env:
          SCOPE: ${{ needs.classify.outputs.scope }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          FAST_QUALITY_RESULT: ${{ needs.fast_quality.result }}
          NORMALIZED_DATABASE_RESULT: ${{ needs.normalized_database.result }}
          NORMALIZED_BROWSER_RESULT: ${{ needs.normalized_browser.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          RELEASE_ARTIFACT_REQUIRED: ${{ needs.classify.outputs.release_artifact_required }}
        run: |
          test "${CLASSIFY_RESULT}" = success
          if [ "${SCOPE}" = docs ]; then
            test "${DOCS_RESULT}" = success
            test "${QUALITY_RESULT}" = skipped
            test "${FAST_QUALITY_RESULT}" = skipped
            test "${NORMALIZED_DATABASE_RESULT}" = skipped
            test "${NORMALIZED_BROWSER_RESULT}" = skipped
            test "${PERFORMANCE_RESULT}" = skipped
            test "${IMAGE_RESULT}" = skipped
          elif [ "${SCOPE}" = ui ]; then
            test "${DOCS_RESULT}" = skipped
            test "${QUALITY_RESULT}" = skipped
            test "${FAST_QUALITY_RESULT}" = success
            test "${NORMALIZED_DATABASE_RESULT}" = skipped
            test "${NORMALIZED_BROWSER_RESULT}" = success
            test "${PERFORMANCE_RESULT}" = skipped
            test "${IMAGE_RESULT}" = skipped
          elif [ "${SCOPE}" = frontend ]; then
            test "${DOCS_RESULT}" = skipped
            test "${QUALITY_RESULT}" = skipped
            test "${FAST_QUALITY_RESULT}" = success
            test "${NORMALIZED_DATABASE_RESULT}" = skipped
            test "${NORMALIZED_BROWSER_RESULT}" = success
            test "${PERFORMANCE_RESULT}" = skipped
            test "${IMAGE_RESULT}" = skipped
          else
            test "${SCOPE}" = full
            test "${DOCS_RESULT}" = skipped
            test "${QUALITY_RESULT}" = success
            test "${FAST_QUALITY_RESULT}" = skipped
            test "${NORMALIZED_DATABASE_RESULT}" = success
            test "${NORMALIZED_BROWSER_RESULT}" = success
            test "${PERFORMANCE_RESULT}" = success
            if [ "${RELEASE_ARTIFACT_REQUIRED}" = true ]; then
              test "${IMAGE_RESULT}" = success
            else
              test "${IMAGE_RESULT}" = skipped
            fi
          fi
      - name: Stage checksummed tag evidence in the pre-release
        if: success() && github.ref_type == 'tag' && needs.classify.outputs.scope == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-evidence
          quality_archive="release-evidence/quality-evidence-${GITHUB_SHA}.tar.gz"
          runtime_archive="release-evidence/runtime-quality-${GITHUB_SHA}.tar.gz"
          tar -C artifacts/quality-evidence -czf "${quality_archive}" .
          tar -C artifacts/runtime-quality -czf "${runtime_archive}" .
          (
            cd release-evidence
            sha256sum "$(basename "${quality_archive}")" > "$(basename "${quality_archive}").sha256"
            sha256sum "$(basename "${runtime_archive}")" > "$(basename "${runtime_archive}").sha256"
            sha256sum --check ./*.sha256
          )
          gh release upload "${GITHUB_REF_NAME}" release-evidence/* --clobber
