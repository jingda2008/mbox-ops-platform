name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbox
          POSTGRES_PASSWORD: mbox_test
          POSTGRES_DB: mbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbox -d mbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser commercial flows
        run: npm run test:e2e
      - name: Provision database runtime role
        env:
          PGPASSWORD: mbox_test
        run: >-
          psql postgresql://mbox@127.0.0.1:5432/mbox_test
          --set ON_ERROR_STOP=1
          --command "CREATE ROLE mbox_app NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://mbox:mbox_test@127.0.0.1:5432/mbox_test
      - name: Verify migration checksums and forced RLS
        run: npm run db:verify
        env:
          DATABASE_URL: postgresql://mbox:mbox_test@127.0.0.1:5432/mbox_test
      - name: Verify normalized operational read path
        run: npm run db:verify:operational
        env:
          DATABASE_URL: postgresql://mbox:mbox_test@127.0.0.1:5432/mbox_test
      - name: Build production container
        run: >-
          docker build
          --build-arg MBOX_RELEASE_SHA=${{ github.sha }}
          --build-arg MBOX_RELEASE_VERSION=$(node -p "require('./package.json').version")
          -t mbox-ops:${{ github.sha }} .

  publish-pre-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --prerelease
          --title "M-BOX Ops Platform ${GITHUB_REF_NAME#v}"
          --notes-file "docs/release-${GITHUB_REF_NAME#v}.md"
