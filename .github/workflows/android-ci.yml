name: Android CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/staff-app/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'native/staff-app/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: native/staff-app/android
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ github.event_name == 'push' && 'gradle' || '' }}
          cache-dependency-path: |
            native/staff-app/android/**/*.gradle.kts
            native/staff-app/android/gradle.properties
            native/staff-app/android/gradle/wrapper/gradle-wrapper.properties
      - name: Ensure the current Android toolchain
        run: |
          test -n "${ANDROID_HOME}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Test update publisher safeguards
        run: |
          mkdir -p ci-reports
          python3 ../scripts/test-prepare-update.py -v 2>&1 | tee ci-reports/publisher-tests.log
      - name: Test, lint and assemble without the optional push SDK
        # Deliberately no release tasks or signing credentials in pull-request CI.
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 --continue -PgetuiSdk=false testDebugUnitTest lintDebug assembleDebug 2>&1 | tee ci-reports/gradle-no-getui.log
          mkdir -p ci-reports/no-getui
          cp -R app/build/test-results/testDebugUnitTest ci-reports/no-getui/
          cp app/build/reports/lint-results-debug.* ci-reports/no-getui/
      - name: Verify the actual optional push SDK without platform credentials
        # Empty App ID keeps SDK runtime disabled; compile the real adapter and manifest.
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 --continue -PgetuiSdk=true testDebugUnitTest lintDebug assembleDebug 2>&1 | tee ci-reports/gradle-getui.log
      - name: Preserve Android test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-checks-${{ github.sha }}
          path: |
            native/staff-app/android/ci-reports/
            native/staff-app/android/app/build/test-results/testDebugUnitTest/
            native/staff-app/android/app/build/reports/tests/testDebugUnitTest/
            native/staff-app/android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
